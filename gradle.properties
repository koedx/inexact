# The fork's source already uses AndroidX, so Jetifier is not needed.
android.useAndroidX=true
android.enableJetifier=false

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AGP 8 defaults nonTransitiveRClass to true. The app references only its own R,
# so this is safe. If a resource-resolution error appears at build time, flipping
# this to false is the first thing to try.
android.nonTransitiveRClass=true
