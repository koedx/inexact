apply plugin: 'com.android.application'

// --- Version constants (kept as two separate values per project convention) ---
// APP_VERSION is semantic; REVISION_DATE is an ISO date. Both are surfaced as
// BuildConfig fields so a single edit here propagates to code and the APK.
def appVersion = "0.1.0"
def revisionDate = "2026-09-29"

android {
    lint {
        disable "ExpiredTargetSdkVersion"
    }

    // namespace = the source/package name for the generated R and BuildConfig
    // classes. It stays com.android.calculator2 so the AOSP source is untouched.
    namespace 'com.android.calculator2'
    compileSdk 34

    defaultConfig {
        // applicationId = the INSTALLED package name. This is the only place the
        // fork diverges from stock: it installs as com.android.calculator,
        // alongside the stock com.android.calculator2.
        applicationId 'com.android.calculator'
        minSdk 29
        targetSdk 29
        versionCode 1
        versionName appVersion

        buildConfigField "String", "APP_VERSION", "\"${appVersion}\""
        buildConfigField "String", "REVISION_DATE", "\"${revisionDate}\""
    }

    // Release signing pulls entirely from environment variables so no key
    // material or password ever lands in the repo. The CI workflow decodes the
    // keystore from a secret to $SIGNING_KEYSTORE_PATH before invoking Gradle.
    signingConfigs {
        release {
            def ksPath = System.getenv("SIGNING_KEYSTORE_PATH")
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv("SIGNING_STORE_PASSWORD")
                keyAlias System.getenv("SIGNING_KEY_ALIAS")
                keyPassword System.getenv("SIGNING_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            // Milestone 0: no shrinking, to keep the first build's variables to a
            // minimum. proguard-rules.pro is wired in but inactive until enabled.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        // AGP 8 no longer generates BuildConfig unless asked.
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // The vendored constructive-reals library lives under src/main/java in the
    // com/hp/creals package, so no extra sourceSet entry is needed.
}

dependencies {
    // Mirrors LOCAL_STATIC_ANDROID_LIBRARIES from the AOSP Android.mk, plus the
    // androidx artifacts the source imports directly. Versions are the current
    // stable releases; all compile cleanly against compileSdk 34.
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.gridlayout:gridlayout:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.viewpager:viewpager:1.0.0'
    implementation 'androidx.customview:customview:1.1.0'
    implementation 'androidx.annotation:annotation:1.7.1'
}
